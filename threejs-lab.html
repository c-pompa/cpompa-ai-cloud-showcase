<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Three.js lab — topographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root{
    --bg:#f1ece0; --fg:#1b262c; --muted:#56636a; --accent:#ad4a26;   /* three tones: sand, slate, rust */
    --panel:rgba(247,243,234,.92); --line:rgba(27,38,44,.2);
    --font:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"Barlow Semi Condensed",var(--font);   /* map lettering for names and numbers, government sans to read, typewriter for the sheet notes */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{background:var(--bg)}
  body{font:15px/1.6 var(--font);color:var(--fg);background:var(--bg)}
  a{color:var(--accent);text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a:hover{text-decoration:underline}

  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  body.nogl #gl{display:none}
  body.pixel #gl{image-rendering:pixelated}
  #markers{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  #content{position:relative;z-index:2;pointer-events:none}
  #content .panel,#content a{pointer-events:auto}

  /* first load: a black sheet and a progress line; the content card unfolds, then the terrain turns over tile by tile, then the dock */
  #boot{position:fixed;left:0;right:0;top:0;z-index:20;height:2px;pointer-events:none;transition:opacity .6s .4s}
  #boot::before{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--p,.1));transition:transform .5s ease}
  #boot span{position:absolute;top:10px;left:50%;transform:translateX(-50%);font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#cfc6b4;white-space:nowrap}
  html[data-boot=ready] #boot{opacity:0}
  #veil{position:fixed;left:0;top:0;z-index:1;width:100%;height:100%;background:#000;pointer-events:none;image-rendering:pixelated}
  .hero{animation:unfold .9s cubic-bezier(.2,.7,.2,1) backwards}
  .hero > *{animation:rise .55s ease-out backwards;animation-delay:calc(.45s + var(--i,0) * 60ms)}
  @keyframes unfold{from{clip-path:inset(50% 0 50% 0 round 6px)}to{clip-path:inset(0 round 6px)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .dock{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  html:not([data-boot=ready]) .dock{opacity:0;transform:translateY(16px);pointer-events:none}
  @media (prefers-reduced-motion:reduce){.hero,.hero > *{animation:none}}

  .dock{position:fixed;z-index:10;right:clamp(16px,3vw,32px);bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 10px rgba(27,38,44,.18);font:500 11px/1.3 var(--mono);color:var(--muted)}
  .dock button{display:grid;place-items:center;width:2rem;height:2rem;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer}
  .dock button:hover{color:var(--fg)}
  .dock button[aria-pressed=true]{color:var(--accent)}
  .light{display:flex;align-items:center;padding-left:.4rem}
  .light > button{width:auto;height:auto;border-radius:999px;display:flex;align-items:center;gap:.5rem;padding:.35rem .45rem;font:inherit}
  .light b{color:var(--fg);font-weight:600;letter-spacing:.06em}
  .light > button[aria-pressed=true] b{color:var(--accent)}
  #place-label,#wx-label{font-size:.75em;letter-spacing:.06em;white-space:nowrap}
  #wx-label{opacity:.75}
  #wx-label:empty{display:none}
  @media (max-width:480px){#wx-label .wind{display:none}.light{padding-left:.1rem}.light > button{gap:.35rem;padding-inline:.3rem}}   /* the dock fits a phone; wind stays in the weather panel */
  .light > button:last-child{padding-right:.7rem}
  #sun-dot{fill:var(--accent);stroke:var(--accent);stroke-width:1.2;transition:cx .4s,cy .4s}
  .light-row{display:flex;gap:.1rem;padding:0 .3rem;border-left:1px solid var(--line)}
  .dock.min > :not(.light-row),.dock.min .light-row > :not(#dock-min){display:none}
  .dock.min .light-row{border-left:0}
  .dock.min #dock-min svg{transform:scaleX(-1)}
  .pop{position:absolute;right:0;bottom:calc(100% + .5rem);width:15rem;display:grid;gap:.55rem;padding:.8rem .9rem;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 16px rgba(27,38,44,.2)}
  .pop[hidden]{display:none}
  .pop .pills,.wx .pills{display:flex;flex-wrap:wrap;gap:.3rem}
  .pop .pills button,.wx .pills button{width:auto;height:auto;padding:.2rem .55rem;border:1px solid var(--line);border-radius:999px;font:inherit}
  .pop .pills button[aria-pressed=true]{border-color:currentColor}
  .pop label{display:grid;grid-template-columns:2.6rem 1fr;align-items:center;gap:.5rem}
  #lamp-panel label,#time-panel label{grid-template-columns:16px 1fr;gap:.6rem}
  #time-panel label:has(:disabled){opacity:.4}
  .pop .pills button{display:inline-flex;align-items:center;gap:.3rem}
  #city-q{font:inherit;padding:.3rem .55rem;border:1px solid var(--line);border-radius:999px;background:none;color:var(--fg)}
  .pop input{width:100%;accent-color:var(--accent)}
#wx-ground{margin:0;font-size:.75em;opacity:.75}

  .wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,48px)}
  .screen{min-height:100vh;display:flex;align-items:center;padding-block:6rem 3rem}
  .col{width:100%;max-width:460px}
  .stack{display:grid;gap:1rem;padding-block:2rem 30vh}
  .panel{background:rgba(247,243,234,.78);position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(27,38,44,.12);border-radius:6px;
    padding:1.25rem 1.4rem;box-shadow:0 1px 2px rgba(27,38,44,.08),0 12px 28px -14px rgba(27,38,44,.45)}
  .eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .eyebrow b{color:var(--accent);font-weight:600}
  h1,h2,h3,.proof b{font-family:var(--display)}
  h1{font-size:clamp(2.4rem,5.5vw,3.8rem);line-height:1;letter-spacing:-.01em;margin:.7rem 0 .8rem;font-weight:700}
  h2{font-size:1.45rem;line-height:1.2;margin:.35rem 0 .5rem}
  p{color:var(--muted)}
  .lede{font-family:var(--display);font-weight:500;color:var(--fg);font-size:1.2rem;line-height:1.3;margin-bottom:.6rem}
  .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
  .tag{font:11px/1 var(--mono);padding:.32rem .5rem;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:1.1rem;margin-top:1rem;font-weight:600}
  #to-contact{margin:-.2rem 0;padding:.2rem .7rem;border:1px solid currentColor;border-radius:999px}
  #to-contact:hover{text-decoration:none;background:color-mix(in srgb,currentColor 12%,transparent)}
  .motto{color:var(--fg);font-style:italic}
  .proof{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:.9rem 0;padding-block:.8rem;border-block:1px solid var(--line)}
  .proof{position:relative;isolation:isolate}
  .proof b{display:block;font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--fg)}
  .proof span{display:block;font-size:.72rem;line-height:1.3;color:var(--muted)}
  .hero{position:relative}
  .proof > div{position:relative;outline:0;display:flex;flex-direction:column}
  .proof > div[data-tip]:hover::after,.proof > div[data-tip]:focus::after{content:attr(data-tip);position:absolute;z-index:2;left:0;top:calc(100% + 4px);
    width:max-content;max-width:15rem;padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--fg);
    font-size:.7rem;line-height:1.35;box-shadow:0 2px 8px rgba(27,38,44,.18)}
  .proof > div:last-of-type[data-tip]::after{left:auto;right:0}
  .proof > div:nth-of-type(2)[data-tip]::after{left:50%;transform:translateX(-50%)}
  .proof svg{display:block;width:100%;height:18px;margin-top:auto;padding-top:.35rem;box-sizing:content-box;overflow:visible;color:var(--fg)}   /* each number's map-legend key, see legend below */
  .proof .lg-fill{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:1.2}
  .proof .lg-ink{stroke:currentColor;stroke-width:1;fill:none}
  .proof .lg-fail{fill:var(--accent)}
  .proof .lg-stake{stroke:var(--accent);stroke-width:2}
  .north{position:absolute;top:1.1rem;right:1.2rem;width:16px;height:22px;color:var(--muted)}
  @property --lamp{syntax:'<number>';inherits:false;initial-value:.5}
  .panel{transition:border-color .2s,box-shadow 1.5s,--lamp 1.2s,background-color 1.2s,filter 1.2s}
  .panel{--lc:255,228,184}
  .panel.on{--lamp:1.5;--lc:255,252,244}   /* the card in focus has white billboard lamps turned up; the rest idle dim and warm */
  /* by day the card in focus lifts out of its stack (brighter face, accent edge, deeper shadow) while its neighbours sit in shade */
  body:not(.night) .panel.on:not(.head){background-color:rgba(255,253,247,.86);border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(173,74,38,.2),0 2px 4px rgba(27,38,44,.12),0 24px 44px -16px rgba(27,38,44,.6)}
  body.night .panel.on:not(.head){border-color:rgba(255,250,240,.9);background-color:rgba(196,204,207,.8)}
  /* the climb's heading lights with its first step: by day its dark face keeps its colour and takes the accent edge */
  body:not(.night) .panel.head.on{border-color:var(--accent);box-shadow:0 0 0 1px rgba(173,74,38,.2),0 2px 4px rgba(27,38,44,.12),0 24px 44px -16px rgba(27,38,44,.6)}
  body.night .panel.head.on{border-color:rgba(255,250,240,.9);background-color:rgba(196,204,207,.8)}
  body.night .stack:has(.panel.on) .panel:not(.on):not(.head){--lamp:.2;filter:brightness(.62) saturate(.7)}
  body.night .panel.head{--muted:var(--fg);color:var(--fg)}   /* the grey night face needs dark ink, not the day card's light text */
  body.night .panel.head .eyebrow,body.night .panel.head p{color:var(--fg);opacity:.85}
  body:not(.night) .stack:has(.panel.on) .panel:not(.on):not(.head){background-color:rgba(222,215,202,.86);filter:brightness(.88) saturate(.8);
    box-shadow:inset 0 0 40px rgba(27,38,44,.12),0 1px 2px rgba(27,38,44,.08)}
  .panel[id^="peak-"],.panel[id^="step-"],#route g{cursor:pointer}
  #route g{pointer-events:auto}
  .panel.hot{border-color:var(--accent)}
  /* every section fades in as it scrolls up into view and out as it leaves the top; the climb's reel keeps its own edge fades */
  @supports (animation-timeline:view()){
    #content .panel:not(.reel .panel):not(.peaks .panel){animation:fade linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
    @keyframes fade{0%,100%{opacity:0}22%,78%{opacity:1}}
  }

  /* survey markers on the map */
  .mk{position:absolute;left:0;top:0;pointer-events:auto;text-align:center;font:500 11px/1.25 var(--mono);color:var(--fg);
    white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg);transition:opacity 1.2s,filter 1.2s,color .4s}
  .mk small{display:block;color:var(--muted);font-size:10px}
  body.night .mk,body.night .mk small,body.night #route text{color:#efe8d8;fill:#efe8d8;text-shadow:0 0 3px #141c21,0 0 6px #141c21}
  .mk:hover,.mk.hot{text-decoration:none;color:var(--accent)}
  .mk.lit{color:var(--accent);font-weight:600}
  #markers.tilt .mk:not(.lit):not(.hot){opacity:.45;filter:blur(1.5px)}
  /* tilt-shift: while a project city is lit, the map outside a band around it goes soft */
  #tilt{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 0s 1.2s;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    -webkit-mask-image:radial-gradient(ellipse 70vw 30vh at var(--fx,50%) var(--fy,50%),transparent 45%,#000 100%);
    mask-image:radial-gradient(ellipse 70vw 30vh at var(--fx,50%) var(--fy,50%),transparent 45%,#000 100%)}
  #tilt.on{opacity:1;visibility:visible;transition:opacity 1.2s}
  h3{font-size:1.15rem;margin:.3rem 0 .3rem}
  .climb{padding-bottom:20vh}
  .climb article{padding-left:1.8rem}
  /* the climb pins a reel of all the cards while the map holds still; the reel steps one card at a time and they fade out at the edges */
  .trek{position:sticky;top:4.5rem;z-index:1;height:calc(100vh - 6rem);
    -webkit-mask-image:linear-gradient(transparent,#000 var(--ft,0px),#000 78%,transparent);mask-image:linear-gradient(transparent,#000 var(--ft,0px),#000 78%,transparent)}
  .reel{position:relative;display:grid;gap:1rem;will-change:transform}
  /* the projects scroll freely, so their edge fades are pinned to the same window as the reel's: set per frame in px */
  .peaks{-webkit-mask-image:linear-gradient(transparent var(--m0,0px),#000 var(--m1,0px),#000 var(--m2,100%),transparent var(--m3,100%));
    mask-image:linear-gradient(transparent var(--m0,0px),#000 var(--m1,0px),#000 var(--m2,100%),transparent var(--m3,100%))}
  .trek-room{height:150vh}   /* the scroll the reel is read over: about 30vh per card */
  .climb article::after{content:"";position:absolute;left:.8rem;top:1.25rem;bottom:1.25rem;width:3px;border-radius:2px;background:var(--accent);opacity:.8}
  .climb .eyebrow b{display:inline-block;padding:.12rem .45rem;border-radius:999px;background:rgba(173,74,38,.1)}
  .beam{position:absolute;left:0;top:0;z-index:-1;border-radius:50%;pointer-events:none;will-change:transform,opacity;opacity:0;
    background:radial-gradient(closest-side,rgba(255,252,240,.6) 70%,rgba(255,255,255,.68) 76%,rgba(255,252,240,.6) 80%,transparent)}
  /* after dark each card is lit like a billboard: four lamps under the bottom border throw warm scallops up the
     face, brightest at the lamps and falling off toward a dimmer top; nothing spills outside the card */
  body.night .panel{--muted:#323d43;background-color:rgba(160,170,174,.74);   /* darker secondary text holds up on the dim top */
    background-image:radial-gradient(ellipse 22% 85% at 12.5% 100%,rgba(var(--lc),calc(.6*var(--lamp))),transparent 72%),
      radial-gradient(ellipse 22% 85% at 37.5% 100%,rgba(var(--lc),calc(.6*var(--lamp))),transparent 72%),
      radial-gradient(ellipse 22% 85% at 62.5% 100%,rgba(var(--lc),calc(.6*var(--lamp))),transparent 72%),
      radial-gradient(ellipse 22% 85% at 87.5% 100%,rgba(var(--lc),calc(.6*var(--lamp))),transparent 72%),
      linear-gradient(to top,rgba(255,214,160,calc(.3*var(--lamp))),transparent 65%);
    box-shadow:inset 0 -2px 0 rgba(255,236,200,calc(.25 + .5*var(--lamp))),0 1px 2px rgba(27,38,44,.08),0 12px 28px -14px rgba(27,38,44,.45)}
  .panel.head{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  .panel.head .eyebrow,.panel.head p{color:var(--bg);opacity:.75}
  .pulse{margin-top:1rem;padding-top:.8rem;border-top:1px dashed var(--line);font:11px/1.4 var(--mono);color:var(--muted)}
  .pulse-top,.pulse-facts{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.3rem 1rem}
  .pulse-facts{justify-content:flex-start}
  .pulse-facts b{color:var(--fg);font-weight:600}
  .pulse .proof{margin:.6rem 0 .3rem;padding:0;border:0}   /* the project and review numbers, keyed like the hero's */
  .pulse .proof b{font-size:1.25rem}
  #review-loop svg{clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1) .15s}   /* in focus its bars draw left to right and its facts rise in turn */
  #review-loop.on svg{clip-path:inset(0)}
  #review-loop .pulse-facts span{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
  #review-loop.on .pulse-facts span{opacity:1;transform:none;transition-delay:calc(.5s + var(--i) * .15s)}
  @media (prefers-reduced-motion:reduce){#review-loop svg,#review-loop .pulse-facts span{transition:none}}
  .proof.era{grid-template-columns:1fr;margin-bottom:0;padding-bottom:0;border-bottom:0}   /* each climb card's era as a scale bar of the years since 2003 */
  #route{position:absolute;left:0;top:0;overflow:visible}
  #route polyline{filter:url(#lineshadow)}
  #route polyline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round}
  #route circle{fill:var(--bg);stroke:var(--accent);stroke-width:2}
  #route text{font:600 10px var(--mono);fill:var(--fg)}
  #route polyline.walked{stroke-dasharray:none;stroke-width:4}
  #route polyline{stroke-opacity:.4}   /* the way ahead is faint, the way walked brighter, the leg being walked brightest */
  #route polyline.walked{stroke-opacity:.7}
  #route polyline.lit{stroke-opacity:1}
  #route polyline,#route .walker,#route g{transition:opacity .6s}
  #route.past polyline,#route.past .walker,#route.past g{opacity:0;pointer-events:none}
  #route .skill,#route .drop{opacity:0;transition:opacity .6s}
  #route .skill{text-anchor:middle;font-size:9px}
  #route .drop{stroke:var(--accent);stroke-width:2;stroke-dasharray:3 3;animation:drop 1s linear infinite}
  @keyframes drop{to{stroke-dashoffset:-6}}
  body.under #route polyline,body.under #route .walker{opacity:0}
  body.under #route .drop,body.under #route.past .skill{opacity:1}
  #route g.done circle,#route g.hot circle,#route .walker{fill:var(--accent)}
  #route .walker{stroke:var(--bg);stroke-width:2}
  #route g.hot text,#route g.cur text{fill:var(--accent)}
  #route g.cur circle{fill:var(--accent);r:13;stroke:color-mix(in srgb,var(--accent) 30%,transparent);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{stroke-width:8}}
  @media (prefers-reduced-motion:reduce){#route g.cur circle{animation:none}}
  /* arriving at a stop, its era's legend key draws itself on the map beside it: a profile, then a stake per year, then fades */
  #route .burst{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;opacity:0;pointer-events:none}
  #route .burst.pro{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke-dasharray:1;stroke-dashoffset:1}
  #route .burst.stake{stroke-width:1.4;transform-box:fill-box;transform-origin:bottom}
  #route .burst.stake.old{stroke:var(--fg)}   /* the years before this era, in ink; this era's in the route colour */
  #route g.cur .burst{animation:burst 3s ease-out forwards}
  #route g.cur .burst.pro{animation:burst 3s ease-out forwards,draw .9s ease-out forwards}
  #route g.cur .burst.stake{animation:burst 3s ease-out forwards,pop .35s calc(.7s + var(--d)) ease-out backwards}
  @keyframes burst{0%,75%{opacity:1}100%{opacity:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{transform:scaleY(0)}}
  #route .lm{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
  #route g.done .lm,#route g.hot .lm,#route g.cur .lm{stroke:var(--bg)}
  #route g:not(.done):not(.hot) .lm{stroke:var(--fg)}   /* stops not reached yet: a dark symbol that reads on the pale disc, the whole stop dimmed */
  #route g:not(.done):not(.hot) > :not(.drop):not(.burst){opacity:.45}

  /* relief: the alternate look, after shaded-relief density maps; greige paper, sea-glass land, cards cast long shadows up and right */
  body.relief{--bg:#cdc4b9;--fg:#1c3048;--muted:#4c585d;--accent:#c94a18;--panel:rgba(226,220,211,.92);--line:rgba(28,48,72,.2)}
  body.relief #route,body.relief #markers{--accent:#1c3048}
  body.relief.night #route{--accent:#a9c6e0}   /* after dark the navy route would sink into the map: it turns pale steel blue */
  body.relief.night #route g.done .lm,body.relief.night #route g.hot .lm,body.relief.night #route g.cur .lm{stroke:#1c3048}   /* and its filled stops take a dark symbol */
  body.relief:not(.night) .panel:not(.head):not(.on){background-color:rgba(232,227,219,.9);box-shadow:14px -12px 30px -10px rgba(74,54,40,.4),0 1px 2px rgba(27,38,44,.08)}

  /* the finale: the contact card alone on the last screen, switching itself on, over a map-sheet margin */
  .finale{min-height:100vh;display:flex;flex-direction:column;gap:1.5rem;padding-top:6rem}
  .finale .col{flex:1;display:flex;align-items:center}
  #contact{width:100%;padding:1.6rem 1.6rem 1.4rem}
  #contact h2{font-size:clamp(1.8rem,3.4vw,2.4rem)}
  
  
  /* the weather reaches the cards: rain running down them and beading where it soaks in, snow falling past and drifting on their top edge.
     Strength comes from the live sky and the ground (--rain, --snow, --wet, --pack, set once a second) */
  .wx-fx{position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse 21px calc(var(--pack,0)*12px) at 50% 0,rgba(250,252,255,.98) 70%,rgba(170,190,210,.7) 92%,transparent) 9px calc(var(--pack,0)*5px - 1px)/71px calc(var(--pack,0)*13px) repeat-x,

      linear-gradient(rgba(250,252,255,.98),rgba(250,252,255,.98)) 0 0/100% calc(var(--pack,0)*5px) no-repeat}
  .wx-fx::before,.wx-fx::after,.wx-fx i{content:"";position:absolute;inset:0}
  /* rain falls at the map's speed and slant (--rain-tilt follows the wind as the map's rain does); every tile height divides
     the 120px loop, so it never jumps. Where it lands, drops splash: rings that flash at a new spot each beat */
  .wx-fx::before{inset:-40%;opacity:var(--rain,0);transform:rotate(var(--rain-tilt,0deg));animation:wx-rain .19s linear infinite;
    background:radial-gradient(.8px 10px,rgba(150,175,195,.8),transparent) 0 0/37px 60px,radial-gradient(.8px 14px,rgba(150,175,195,.65),transparent) 13px 20px/53px 120px,radial-gradient(.7px 8px,rgba(150,175,195,.75),transparent) 7px 10px/29px 40px}
  @keyframes wx-rain{to{background-position:0 120px,13px 140px,7px 130px}}
  .wx-fx i{opacity:var(--rain,0);background:var(--splash,none)}   /* drops and splashes are scattered at random over one large tile, see wxDrops */
  .wx-fx .wet{opacity:var(--wet,0);background:var(--beads,none)}
  /* snow blows past the glass, slanted further than rain as the wind picks up (--snow-tilt, --snow-dur), while flakes that
     hit it stick, hold their crystal for a few seconds, and melt away, each on its own beat (see wxDrops) */
  .wx-fx::after{inset:-40%;opacity:var(--snow,0);transform:rotate(var(--snow-tilt,0deg));animation:wx-snow var(--snow-dur,9s) linear infinite;background:var(--flakes,none)}

  .wx-fx .ice{opacity:var(--snow,0);background:var(--ice,none)}
  .wx-fx .mist{opacity:var(--fog,0);background:radial-gradient(ellipse 70% 45% at 20% 100%,rgba(232,238,243,.85),transparent 70%),radial-gradient(ellipse 80% 40% at 85% 90%,rgba(232,238,243,.7),transparent 70%),linear-gradient(to top,rgba(226,233,239,.6),rgba(226,233,239,.15) 70%)}   /* fog: a low bank of mist across the card */
  @media (prefers-reduced-motion:reduce){.wx-fx::before,.wx-fx::after{animation:none}}
  #contact::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;pointer-events:none;transition:opacity 1.2s;
    background:radial-gradient(ellipse 90% 70% at 15% 100%,rgba(255,226,176,.55),transparent 70%),radial-gradient(ellipse 60% 50% at 90% 0%,rgba(255,250,236,.5),transparent 70%)}
  #contact.on::before{opacity:1;animation:ignite 1.6s ease-out}
  @keyframes ignite{0%{opacity:0}9%{opacity:.9}14%{opacity:.15}22%{opacity:1}28%{opacity:.4}40%,100%{opacity:1}}
  .sheet{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:1rem 2rem;margin-bottom:5rem;padding:.9rem 1.2rem;
    background:color-mix(in srgb,var(--panel) 50%,transparent);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);   /* frosted: the map shows through */
    border:1px solid var(--line);outline:1px solid var(--line);outline-offset:3px;border-radius:2px;
    font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);pointer-events:auto}

  .legend{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem}

  .scale{display:grid;gap:.25rem;width:120px}
  .scale-n{display:flex;justify-content:space-between}

  #coords{font-variant-numeric:tabular-nums;color:var(--fg)}
  /* the trail rides above the cards so its arrival at the pin shows; at the bottom it draws itself down from the top of the screen */
  #trailend{position:fixed;left:0;top:0;z-index:3;pointer-events:none;overflow:visible;opacity:0;transition:opacity .4s}
  #trailend mask path{fill:none;stroke:#fff;stroke-width:12;stroke-dasharray:1 1;stroke-dashoffset:1}

  @media (prefers-reduced-motion:reduce){#trailend.on mask path{transition:none}}
  #trailshade{position:fixed;left:0;top:0;z-index:1;pointer-events:none;overflow:visible;opacity:0;transition:opacity .4s}   /* under the cards: the shadow lands on the land only */
  #trailshade path{fill:none;stroke:#14202b;stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round}

  @media (prefers-reduced-motion:reduce){.wp .ping,#contact.on::before{animation:none}}

<script type="module">

  ],
  stats: { total: 620, rate: 86.9, prod: 43, daily: [13,0,0,0,0,32,50,46,87,5,10,8,34,85,3,58,32,66,19,0,0,20,13,23,16,0,0,0,0],   // every cpompa-ai-cloud pipeline to date (Sep 4 to Oct 2 2026) and its runs per day, as in ci-activity-data.json

// Relief palette: contour ink, lamp tint, hypsometric band low/high, sea, shadow; sun tints at dusk, noon, and night.
const MAP = { ink: '#33434b', accent: '#ad4a26', lo: '#d6c9ac', hi: '#f2ebdc', sea: '#a6bcc3', deep: '#40616f', shadow: '#2c404a',
  grass: '#a9b08a', forest: '#6f8062', dusk: '#f0b48c', noon: '#fbf3e3', moon: '#b3c3ca' };

// Relief palette (the alternate look): sea-glass lowland, navy shade, orange-to-amber heat on the project peaks.
const RELIEF = { ink: '#1d3346', accent: '#e8561c', lo: '#a9c3c0', hi: '#c6d7d3', sea: '#b4c6c6', deep: '#4d7180', shadow: '#1e3346',
  grass: '#94b4b2', forest: '#5d8590', dusk: '#f2c7a6', noon: '#eef3f0', moon: '#b3c3ca' };
let PAL = MAP;

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = !matchMedia('(hover: hover)').matches;
const PAN = TOUCH ? 1 : .75; // map scrolls slower than the content, but fast enough to keep card-anchored features apart; on touch it moves with the cards

// load stages, for the progress line and for status checks: html[data-boot] and performance marks boot:content, boot:terrain, boot:ready
const bootEl = document.getElementById('boot');
const boot = (stage, pct, label) => {
  document.documentElement.dataset.boot = stage; performance.mark('boot:' + stage);
  bootEl.style.setProperty('--p', pct / 100); bootEl.setAttribute('aria-valuenow', pct); bootEl.firstChild.textContent = label;
};

/* ── content ─────────────────────────────────────────────── */
const tags = t => `<div class="tags">${t.map(x => `<span class="tag">${x}</span>`).join('')}</div>`;
const pad = i => String(i + 1).padStart(2, '0');
// each hero number gets a key drawn the way a map's legend would: runs as an elevation profile of runs per day,
// the pass rate as a scale bar with the failed share in rust, every gated deploy as a survey stake on its date
// (the project cards and the review loop draw their numbers with the same two keys)
const profileKey = daily => {
  const n = daily.length, top = Math.max(1, ...daily);
  const pts = daily.map((c, i) => `${(i / (n - 1) * 100).toFixed(1)},${(16 - 14 * c / top).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true"><polygon class="lg-fill" points="0,16 ${pts} 100,16" vector-effect="non-scaling-stroke"/><line class="lg-ink" x1="0" y1="16.5" x2="100" y2="16.5" vector-effect="non-scaling-stroke"/></svg>`;
};
const scaleKey = pct => {
  const bar = Array.from({ length: 10 }, (_, k) => `<rect x="${k * 10}" y="7" width="10" height="5" fill="${k % 2 ? 'none' : 'currentColor'}"/>`).join('');
  return `<svg viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true">${bar}<rect class="lg-fail" x="${pct}" y="7" width="${100 - pct}" height="5"/><rect class="lg-ink" x="0" y="7" width="100" height="5" vector-effect="non-scaling-stroke"/>${[0, 50, 100].map(x => `<line class="lg-ink" x1="${x}" y1="4" x2="${x}" y2="15" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`;
};
// a climb card's years on a scale bar of every year since the first: a cell per year, the years still to come faded, this era's span in rust, a tick where each era starts
const yearsOf = c => { const [a, b] = c.year.split('–'); return [+a, b === 'now' ? new Date().getFullYear() : +b]; };
const eraKey = c => {
  const first = yearsOf(DATA.climb[0])[0], n = new Date().getFullYear() - first, x = y => ((y - first) / n * 100).toFixed(2), [a, b] = yearsOf(c);
  const bar = Array.from({ length: n }, (_, k) => `<rect x="${x(first + k)}" y="7" width="${(100 / n).toFixed(2)}" height="5" fill="${k % 2 ? 'none' : 'currentColor'}"${first + k < b ? '' : ' fill-opacity=".25"'}/>`).join('');
  const ticks = DATA.climb.map(e => yearsOf(e)[0]).concat(first + n).map(y => `<line class="lg-ink" x1="${x(y)}" y1="4" x2="${x(y)}" y2="15" vector-effect="non-scaling-stroke"/>`).join('');
  return `<div class="proof era"><div tabindex="0" data-tip="The scale bar runs ${first} to now, a cell per year; the rust span is this era, ${a} to ${c.year.endsWith('now') ? 'now' : b}."><b>${b - first} yrs</b><span>in the field ${c.year.endsWith('now') ? 'to date' : 'by ' + b}</span>`
    + `<svg viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true">${bar}<rect class="lg-fail" x="${x(a)}" y="7" width="${x(b) - x(a)}" height="5"/><rect class="lg-ink" x="0" y="7" width="100" height="5" vector-effect="non-scaling-stroke"/>${ticks}</svg></div></div>`;
};
const legend = (() => {

    }
    float fill = 1. - smoothstep(1.44, 1.92, rd), rail = fill - (1. - smoothstep(.88, 1.28, rd));   // pale guideway with slate edges

    col = mix(col, mix(uInk, uLo, .35), .49 * rail * road);

    col = mix(col, mix(uInk, uLo, .6), .6 * strip * land);

  cityT = setTimeout(() => fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { if (cityQ.value.trim() === q) listCities((j.results || []).filter(c => Number.isFinite(c.latitude) && Number.isFinite(c.longitude)).map(c => [String(c.name), c.latitude, c.longitude, String(c.admin1 || c.country || '')])); })
    .catch(() => {}), 250);
});
listCities(CITIES);
// the ground: every frame the soak, snowpack and parch ease toward a limit set by how hard it is raining, snowing
// or shining now, so a drizzle only dampens while a storm floods the flats. They build over minutes and fade
// slower (snow stays put below freezing); the test panel runs the clock 30x
const groundEl = document.getElementById('wx-ground');
document.querySelectorAll('.panel').forEach(p => p.insertAdjacentHTML('afterbegin', '<i class="wx-fx" aria-hidden="true"><i class="mist"></i><i></i><i class="wet"></i><i class="ice"></i></i>'));
{ // wxDrops: the cards' beads and splashes at random spots on a 480x360 tile, so no grid shows; each splash ring keeps its own beat
  const r = (a, b) => (a + Math.random() * (b - a)).toFixed(1), tile = body => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='480' height='360'>${body}</svg>`)}")`;
  const beads = Array.from({ length: 90 }, () => `<circle cx='${r(0, 480)}' cy='${r(0, 360)}' r='${r(.7, 2.6)}' fill='rgba(255,255,255,.5)' stroke='rgba(80,110,135,.4)' stroke-width='.6'/>`);
  const rings = REDUCE ? [] : Array.from({ length: 40 }, () => { const d = r(.35, .7), b = r(0, .7);
    return `<circle cx='${r(0, 480)}' cy='${r(0, 360)}' fill='none' stroke='rgba(215,230,240,.8)' stroke-width='.8' r='0'><animate attributeName='r' values='0;3.2' dur='${d}s' begin='${b}s' repeatCount='indefinite'/><animate attributeName='opacity' values='1;0' dur='${d}s' begin='${b}s' repeatCount='indefinite'/></circle>`; });
  document.body.style.setProperty('--beads', tile(beads.join('')));
  if (rings.length) document.body.style.setProperty('--splash', tile(rings.join('')));
  const flakes = Array.from({ length: 70 }, () => { const z = Math.random();   // snow going past: near flakes bigger and softer
    return `<circle cx='${r(0, 480)}' cy='${r(0, 360)}' r='${(.8 + 2.4 * z * z).toFixed(1)}' fill='rgba(255,255,255,${(.7 + .3 * z).toFixed(2)})' stroke='rgba(120,145,170,.35)' stroke-width='.5'${z > .8 ? " filter='url(#b)'" : ''}/>`; });
  document.body.style.setProperty('--flakes', tile(`<filter id='b'><feGaussianBlur stdDeviation='.8'/></filter>${flakes.join('')}`));
  const ice = Array.from({ length: 45 }, () => {   // a flake on the glass: six arms with side ticks, outlined so it shows on the pale cards
    const k = r(2.5, 6), arm = `<path d='M0 -${k}V${k}M-${k * .3} -${k * .7}L0 -${k * .45}L${k * .3} -${k * .7}M-${k * .3} ${k * .7}L0 ${k * .45}L${k * .3} ${k * .7}'/>`;
    const d = r(5, 11), b = -r(0, 11), live = REDUCE ? '' : `<animate attributeName='opacity' values='0;.95;.8;0' keyTimes='0;.03;.6;1' dur='${d}s' begin='${b}s' repeatCount='indefinite'/>`;
    return `<g transform='translate(${r(0, 480)} ${r(0, 360)}) rotate(${r(0, 60)})' opacity='${REDUCE ? .85 : 0}'>${live}<g stroke='rgba(80,105,130,.5)' stroke-width='1.5'>${[0, 60, 120].map(a => `<g transform='rotate(${a})'>${arm}</g>`).join('')}</g><g stroke='#fff' stroke-width='.7'>${[0, 60, 120].map(a => `<g transform='rotate(${a})'>${arm}</g>`).join('')}</g></g>`; });
  document.body.style.setProperty('--ice', tile(`<g fill='none' stroke-linecap='round'>${ice.join('')}</g>`));
}
try {   // the last visit's ground, faded by the time away (half gone in about 1.4 hours); storage can be blocked or empty
  const { g, at } = JSON.parse(localStorage.getItem('lab-ground'));
  const left = Math.exp(-Math.max(Date.now() - at, 0) / 72e5);
  uniforms.uGround.value.fromArray(g.map(v => Math.min(Math.max(+v || 0, 0), 1) * left));
} catch {}
function groundStep(sec) {
  const [cl, rn, sn, fg] = uniforms.uWx.value.toArray(), g = uniforms.uGround.value, k = wxManual ? 30 : 1;
  const sun = (1 - cl) * (1 - uniforms.uNight.value) * Math.min(Math.max((wxTemp - 40) / 40, 0), 1);   // only a warm clear day parches
  const to = [Math.max(rn, .3 * fg), sn, .8 * sun * (1 - g.x) * (1 - g.y)];
  const rate = [[.006, .0015 * (1 + 2 * sun)], [.003, wxTemp > 33 ? .002 * (1 + 2 * sun) : 0], [.0006, .01]];   // per second: [rise, fade]
  to.forEach((v, i) => { const now = g.getComponent(i); g.setComponent(i, now + (v - now) * (1 - Math.exp(-(v > now ? rate[i][0] : rate[i][1]) * k * sec))); });
}
let groundSaved = uniforms.uGround.value.toArray();
setInterval(() => {   // once a second: keep it for the next visit, wake a reduced-motion render, update the test readout
  const g = uniforms.uGround.value;
  if (g.toArray().some((v, i) => Math.abs(v - groundSaved[i]) > 1e-3)) {
    groundSaved = g.toArray(); still = 0;
    try { localStorage.setItem('lab-ground', JSON.stringify({ g: groundSaved, at: Date.now() })); } catch {}
  }
  const cs = document.body.style, wx = uniforms.uWx.value;
  cs.setProperty('--rain', wx.y.toFixed(2)); cs.setProperty('--rain-tilt', (-Math.atan(uniforms.uWind.value.x * .025) * 180 / Math.PI).toFixed(1) + 'deg'); cs.setProperty('--snow', wx.z.toFixed(2)); cs.setProperty('--fog', wx.w.toFixed(2));
  const wind = uniforms.uWind.value.x; cs.setProperty('--snow-tilt', (-Math.atan(wind * .05) * 180 / Math.PI).toFixed(1) + 'deg'); cs.setProperty('--snow-dur', (9 / (1 + Math.abs(wind) / 12)).toFixed(1) + 's');   // the harder it blows, the faster it goes by cs.setProperty('--wet', g.x.toFixed(2)); cs.setProperty('--pack', g.y.toFixed(2));
  if (wxManual) groundEl.textContent = `Ground: wet ${Math.round(g.x * 100)}% · snow ${Math.round(g.y * 100)}% · dry ${Math.round(g.z * 100)}%`;
}, 1000);

const features = [...stops, ...peaks];
const tiltEl = document.getElementById('tilt'), focus = new THREE.Vector2();
const railAt = Array(8).fill(-1);   // when each section of the underground line came on, -1 while it is dark
let lit = -2, focusAt = null;   // index of the lit project city, -1 for none; the map point the tilt-shift keeps sharp
const heroCard = document.querySelector('.panel.hero'), climbHead = document.querySelector('.climb .panel.head'), peaksHead = document.querySelector('.peaks .panel.head');
let onCard = null;
const CRAFT = [{ a: .35, v: 26, o: .1, x: .62 }, { a: 2.7, v: 22, o: .55, x: .7 }, { a: 5.9, v: 30, o: .8, x: .6 }];   // heading, px/s, phase, lane x
function frame(t = performance.now()) {
  const dt = lastT ? Math.min(t - lastT, 100) : 16.7, f60 = dt / 16.7;   // easing is per time, not per frame, so 60/120Hz feel the same
  lastT = t;
  const pan = panAt(scrollY), panned = pan !== lastPan || scrollY !== lastScroll;
  if (panned) {                                                          // DOM markers only move when the page scrolls
    lastPan = pan; lastScroll = scrollY;
    peaks.forEach(k => { k.el.style.transform = `translate(${k.x}px, ${k.y - pan - 60}px) translate(-50%, -100%)`; });
    const at = reading(projRun, scrollY);                                // the current project card lights its city
    let best = Infinity, next = -1;
    if (scrollY > projRun.a - innerHeight / 4 && scrollY < endAt) peaks.forEach((k, i) => { const d = Math.abs(k.c - at); if (d < best) { best = d; next = i; } });
    if (next !== lit) {
      lit = next;
      peaks.forEach((k, i) => k.el.classList.toggle('lit', i === lit));
      markersEl.classList.toggle('tilt', lit >= 0);
    }
    const step = stops[Math.min(Math.max(Math.round(climbAt(scrollY)), 0), stops.length - 1)];   // while the climb is read, its current landmark
    const fk = lit >= 0 ? peaks[lit] : scrollY > storyRun.a - innerHeight / 4 && scrollY < storyRun.b + innerHeight * .1 ? { x: step.x, y: step.y - 110 } : null;
    if (fk && !focusAt) focus.copy(fk);                                  // fading in: start in focus, only glide between cities
    focusAt = fk; tiltEl.classList.toggle('on', !!fk);
    // the card in focus: the hero at the top, then the current timeline card, then the projects' header, then the lit project
    const fin = scrollY >= endAt;
    const pt = 72 - peaksEl.getBoundingClientRect().top, ph = innerHeight - 96;   // the reel's window: 4.5rem down, 1.5rem short of the bottom
    if (!TOUCH) peaksEl.style.cssText = `--m0:${pt}px;--m1:${pt + ph * .22}px;--m2:${pt + ph * .78}px;--m3:${pt + ph}px`;
    for (const e of [trailEnd, trailShade]) { e.classList.toggle('on', fin); e.style.transform = `translateY(${-pan}px)`; }
    let on = fin ? contactCard : lit >= 0 ? document.getElementById('peak-' + lit) : scrollY < storyRun.a / 2 ? heroCard : scrollY > (projRun.h + projRun.r) / 2 && !loopCard.hidden ? loopCard : scrollY > (storyRun.b + projRun.h) / 2 ? peaksHead : null;
    if (!on) {
      on = document.getElementById('step-' + Math.min(stops.length - 1, Math.max(0, Math.round(climbAt(scrollY)))));
    }
    if (on !== onCard) {
      onCard?.classList.remove('on'); on.classList.add('on'); onCard = on; climbHead.classList.toggle('on', on.id === 'step-0');
      if (on === loopCard && !REDUCE) loopCard.querySelectorAll('b').forEach(b => {   // in focus, the review loop counts its numbers up (its bars draw in CSS)
        const n = +(b.dataset.n ??= b.textContent), t0 = performance.now();
        (function up(t) { const e = Math.min(1, (t - t0) / 1100); b.textContent = Math.round(n * (1 - (1 - e) ** 3)); if (e < 1) requestAnimationFrame(up); })(t0);
      });
    }
    route.style.transform = `translateY(${-pan}px)`;
    walk(scrollY);
  }
  if (!renderer) return;
  if (!HOVER && panned) {
    const mid = pan + innerHeight / 2;
    let near = features[0];
    for (const k of features) if (Math.abs(k.y - mid) < Math.abs(near.y - mid)) near = k;
    pointer.x = near.x; pointer.y = near.y - pan;
  }
  let settling = 0;                                                      // lit cities fade in and out over about a second
  uniforms.uLit.value.forEach((g, i) => { const d = (i === lit ? 1 : 0) - g; settling = Math.max(settling, Math.abs(d)); uniforms.uLit.value[i] = g + d * (REDUCE ? 1 : 1 - Math.pow(.96, f60)); });
  const du = (underEl.getAttribute('aria-pressed') === 'true' ? 1 : 0) - uniforms.uUnder.value;
  settling = Math.max(settling, Math.abs(du)); uniforms.uUnder.value += du * (REDUCE ? 1 : 1 - Math.pow(.93, f60));
  uniforms.uLamp.value = (lampOn ? lampSet : 0) * (1 - uniforms.uUnder.value);
  groundStep(dt / 1000);
  const dp = (route.classList.contains('past') ? 1 : 0) - uniforms.uPast.value;
  settling = Math.max(settling, Math.abs(dp)); uniforms.uPast.value += dp * (REDUCE ? 1 : 1 - Math.pow(.93, f60));
  peaks.forEach((k, i) => uniforms.uMarks.value[5 + i].set(k.x, k.y, i === lit ? 2 : 1));   // each project city's centrepiece, ringed while it is read
  uniforms.uRail.value.forEach((_, i) => {                               // the underground line comes on section by section: to the era or project being read, all once passed
    const on = i < 4 ? uniforms.uMarks.value[i + 1].z > .5 : lit >= 0 ? i - 4 <= lit : route.classList.contains('past');
    if (!on) railAt[i] = -1; else if (railAt[i] < 0) railAt[i] = t;
    const e = railAt[i] < 0 ? -1 : REDUCE ? 9 : (t - railAt[i]) / 1000;
    uniforms.uRail.value[i] = e;
    if (e >= 0 && e < 1.3) settling = 1;
  });
  if (focusAt) {
    focus.lerp(focusAt, REDUCE ? 1 : 1 - Math.pow(.93, f60));
    tiltEl.style.setProperty('--fx', focus.x + 'px'); tiltEl.style.setProperty('--fy', focus.y - pan + 'px');
  }
  aim.set(pointer.x, pointer.y + pan);
  const lag = uniforms.uMouse.value.distanceTo(aim), hv = uniforms.uHover.value, want = pointer.on ? 1 : 0;
  uniforms.uMouse.value.lerp(aim, REDUCE ? 1 : 1 - Math.pow(.92, f60));
  if (trailShade.classList.contains('on')) {                             // the trail floats a few px over the land
    const sun = uniforms.uSun.value, h = 9 / Math.max(sun.z, .35), m = uniforms.uMouse.value, [disc, shSun, shLamp] = trailShade.querySelectorAll('circle, .sun, .lamp');   // in document order
    shSun.setAttribute('transform', `translate(${-sun.x * h} ${-sun.y * h})`);
    shSun.style.opacity = .8 * uniforms.uSunAmt.value * (1 - .8 * uniforms.uWx.value.w);
    disc.setAttribute('cx', m.x); disc.setAttribute('cy', m.y); disc.setAttribute('r', uniforms.uSpot.value * 1.15);
    shLamp.style.opacity = .75 * uniforms.uHover.value * Math.min(uniforms.uLamp.value, 1);
  }
  uniforms.uCursor.value.copy(HOVER ? aim : uniforms.uMouse.value);    // touch: the spot glides between features, no haze streak
  uniforms.uHover.value += (want - hv) * (1 - Math.pow(.94, f60));
  uniforms.uPan.value = pan;
  let ci = 0;                                                            // the cards on screen, in map space, for their shadows under the lamp
  if (!TOUCH) for (const el of panels) { const r = el.getBoundingClientRect(); if (ci < 6 && r.width && r.bottom > 0 && r.top < innerHeight) uniforms.uCards.value[ci++].set(r.left, r.top + pan, r.right, r.bottom + pan); }
  while (ci < 6) uniforms.uCards.value[ci++].set(0, 0, 0, 0);
  // idle (nothing moved for a second): water ripples only need 30fps, and with reduced motion nothing needs drawing
  still = panned || lag > .5 || settling > .005 || Math.abs(want - hv) > .002 ? 0 : still + dt;
  if (still < 1000) {
    const r = uniforms.uSpot.value, sx = uniforms.uMouse.value.x - r, sy = uniforms.uMouse.value.y - pan + scrollY - r;
    const a = uniforms.uHover.value * Math.min(uniforms.uLamp.value, 1);
    for (const k of beams) {
      if (k.el.id.startsWith('step-')) { const r = k.el.getBoundingClientRect(); k.x = r.left; k.y = r.top + scrollY; }   // in the pinned reel: they move with the page
      if (k.r !== r) { k.r = r; k.b.style.width = k.b.style.height = 2 * r + 'px'; }
      k.b.style.transform = `translate(${sx - k.x}px, ${sy - k.y}px)`; k.b.style.opacity = a;
    }
  }
  if (still > 1000 && (REDUCE ? still > 1100 : tick++ & 1)) return;
  // slow GPU: step the resolution down once frames have run over 22ms for ~.7s in total, never below .75x
  slow = dt > 22 ? slow + dt : Math.max(0, slow - dt);
  if (slow > 700 && renderer.getPixelRatio() > .75) { renderer.setPixelRatio(Math.max(.75, renderer.getPixelRatio() - .25)); resize(); slow = 0; }
  if (!REDUCE) uniforms.uTime.value = t / 1000;
  const reg = uniforms.uRegion.value, lanes = [innerHeight * .4, (reg.x + reg.y) / 2, reg.y + innerHeight * .5];
  CRAFT.forEach((c, i) => {                                              // each region keeps its own aircraft; they scroll away with the land
    const s = (uniforms.uTime.value * c.v + 2600 * c.o) % 2600 - 1300, dx = Math.cos(c.a), dy = Math.sin(c.a);
    uniforms.uCraft.value[i].set(innerWidth * c.x + dx * s, lanes[i] + dy * s, dx, dy);
  });                          // water ripples and coastal wind only; contour lines never move
  renderer.render(scene, camera);
}
// the content card unfolds while the shader compiles off the main thread; then tiny black tiles turn over at random onto the terrain
const intro = new Promise(r => setTimeout(r, REDUCE ? 0 : 1300));
function reveal() {
  const veil = document.getElementById('veil'), ready = () => { veil.remove(); boot('ready', 100, 'Ready'); };
  boot('terrain', 75, 'Turning the tiles');
  if (!renderer || REDUCE) return ready();
  // one canvas pixel per 3px tile, scaled up crisp: the size of the paper grain, far too many tiles for elements
  const S = 3, cols = Math.ceil(innerWidth / S), rows = Math.ceil(innerHeight / S);
  Object.assign(veil, { width: cols, height: rows });
  Object.assign(veil.style, { width: cols * S + 'px', height: rows * S + 'px', background: 'none' });
  const ctx = veil.getContext('2d'), img = ctx.createImageData(cols, rows), px = new Uint32Array(img.data.buffer);
  const at = Float32Array.from({ length: cols * rows }, () => Math.random() * 1400), t0 = performance.now();
  (function turn() {
    const t = performance.now() - t0;
    for (let i = 0; i < at.length; i++) px[i] = t < at[i] ? 0xff000000 : t < at[i] + 180 ? 0xff2f3228 : 0;   // black, a flash of its dark face (ABGR), then clear
    ctx.putImageData(img, 0, 0);
    if (t < 1600) requestAnimationFrame(turn); else ready();
  })();
}
if (renderer) Promise.all([renderer.compileAsync(scene, camera).catch(() => {}), intro]).then(() => {
  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => requestAnimationFrame(reveal));          // the first terrain frame is drawn under the tiles
});
else { addEventListener('scroll', frame); frame(); intro.then(reveal); }
</script>
